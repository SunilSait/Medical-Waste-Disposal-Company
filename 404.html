<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | SafeDispose</title>
    <meta name="description" content="The page you're looking for doesn't exist. Return to SafeDispose home page.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="fullscreen-page">

    <!-- Top Bar -->
    <div class="fullscreen-topbar">
        <a href="index.html" class="nav-logo" aria-label="SafeDispose Home">
            <svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs><linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0F766E"/><stop offset="100%" stop-color="#14B8A6"/></linearGradient></defs>
                <rect width="100" height="100" rx="22" fill="url(#logoBg)"/>
                <path d="M50 22 L50 78 M28 50 L72 50" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
                <path d="M32 28 L50 18 L68 28" stroke="#99F6E4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
                <circle cx="50" cy="50" r="32" stroke="#99F6E4" stroke-width="2" fill="none" opacity="0.3"/>
            </svg>
            <div class="nav-logo-text">
                <span class="brand-top">MEDICAL WASTE</span>
                <span class="brand-bottom">SafeDispose</span>
            </div>
        </a>
        <div style="display:flex;gap:0.5rem;">
            <button onclick="toggleDir(event)" class="nav-icon-btn" title="Toggle Direction" aria-label="Toggle direction">
                <span class="dir-label" style="font-size:0.625rem;font-weight:600;">RTL</span>
            </button>
            <button onclick="toggleTheme(event)" class="nav-icon-btn" title="Toggle Theme" aria-label="Toggle dark mode">
                <span class="theme-icon-wrap"><i class="fa-solid fa-moon"></i></span>
            </button>
        </div>
    </div>

    <!-- Content -->
    <div class="fullscreen-content">
        <div style="position:relative;max-width:540px;width:100%;margin:0 auto;">
            <!-- Decorative spinning biohazard shield illustration -->
            <div class="error-illustration">
                <svg class="error-bg-spin" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="60" cy="60" r="50" stroke="#0F766E" stroke-width="6" stroke-dasharray="12 12"/>
                    <path d="M60 25 L90 45 L90 80 L60 100 L30 80 L30 45 Z" stroke="#14B8A6" stroke-width="4" fill="none"/>
                    <circle cx="60" cy="60" r="16" fill="#0F766E" opacity="0.3"/>
                </svg>
                <div class="error-code">404</div>
            </div>

            <div class="error-subtitle">Page Not Found</div>
            <p class="error-desc">
                Sorry, the page you're looking for doesn't exist or has been moved. Let's get you back to safety.
            </p>

            <div class="error-actions">
                <a href="index.html" class="btn btn-primary btn-lg"><i class="fa-solid fa-house"></i> Back to Home</a>
                <a href="contact.html" class="btn btn-secondary btn-lg"><i class="fa-solid fa-headset"></i> Contact Support</a>
            </div>
        </div>
    </div>

    <script src="components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initAuthPage();
        });
    </script>
</body>
</html>
