<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon — SafeDispose</title>
    <meta name="description" content="This medical waste client portal feature is coming soon. Stay tuned for updates from SafeDispose.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="fullscreen-page">

    <!-- Top Bar -->
    <div class="fullscreen-topbar">
        <a href="index.html" class="nav-logo" aria-label="SafeDispose Home">
            <svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs><linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0F766E"/><stop offset="100%" stop-color="#14B8A6"/></linearGradient></defs>
                <rect width="100" height="100" rx="22" fill="url(#logoBg)"/>
                <path d="M50 22 L50 78 M28 50 L72 50" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round"/>
                <path d="M32 28 L50 18 L68 28" stroke="#99F6E4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
                <circle cx="50" cy="50" r="32" stroke="#99F6E4" stroke-width="2" fill="none" opacity="0.3"/>
            </svg>
            <div class="nav-logo-text">
                <span class="brand-top">MEDICAL WASTE</span>
                <span class="brand-bottom">SafeDispose</span>
            </div>
        </a>
        <div style="display:flex;gap:0.5rem;">
            <button onclick="toggleDir(event)" class="nav-icon-btn" title="Toggle Direction" aria-label="Toggle direction">
                <span class="dir-label" style="font-size:0.625rem;font-weight:600;">RTL</span>
            </button>
            <button onclick="toggleTheme(event)" class="nav-icon-btn" title="Toggle Theme" aria-label="Toggle dark mode">
                <span class="theme-icon-wrap"><i class="fa-solid fa-moon"></i></span>
            </button>
        </div>
    </div>

    <!-- Content -->
    <div class="fullscreen-content">
        <div class="coming-soon-wrapper">
            <!-- Decorative glow -->
            <div style="position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);width:min(450px,90vw);height:min(450px,90vw);background:radial-gradient(circle,rgba(20,184,166,0.12),transparent 65%);border-radius:50%;pointer-events:none;"></div>

            <div style="position:relative;z-index:2;">
                <div class="section-badge" style="margin-bottom:1rem;">
                    <i class="fa-solid fa-rocket"></i> Under Construction
                </div>
                <h1 class="coming-title">Coming Soon</h1>
                <p class="coming-desc">
                    We're crafting something exciting for you. This medical waste client portal feature will launch soon. Subscribe to get notified first!
                </p>

                <!-- Countdown -->
                <div class="countdown-grid" id="countdown">
                    <div class="countdown-item">
                        <span class="countdown-value" id="cd-days">30</span>
                        <span class="countdown-label">Days</span>
                    </div>
                    <div class="countdown-item">
                        <span class="countdown-value" id="cd-hours">12</span>
                        <span class="countdown-label">Hours</span>
                    </div>
                    <div class="countdown-item">
                        <span class="countdown-value" id="cd-mins">45</span>
                        <span class="countdown-label">Minutes</span>
                    </div>
                    <div class="countdown-item">
                        <span class="countdown-value" id="cd-secs">00</span>
                        <span class="countdown-label">Seconds</span>
                    </div>
                </div>

                <!-- Subscribe Form -->
                <form class="subscribe-form" onsubmit="event.preventDefault(); alert('Subscribed! We will notify you as soon as this feature launches.'); this.reset();">
                    <input type="email" placeholder="your@hospital.com" required>
                    <button type="submit" class="btn btn-primary">Notify Me</button>
                </form>

                <!-- Socials -->
                <div class="coming-socials">
                    <a href="#" class="coming-social-link" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#" class="coming-social-link" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
                    <a href="#" class="coming-social-link" aria-label="Twitter"><i class="fa-brands fa-x-twitter"></i></a>
                    <a href="#" class="coming-social-link" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
                </div>

                <div>
                    <a href="index.html" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
                </div>
            </div>
        </div>
    </div>

    <script src="components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initAuthPage();

            // Dynamic live countdown (30 days from now)
            const targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + 30);

            function updateCountdown() {
                const now = new Date();
                const diff = targetDate - now;
                if (diff <= 0) return;

                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const secs = Math.floor((diff % (1000 * 60)) / 1000);

                const dEl = document.getElementById('cd-days');
                const hEl = document.getElementById('cd-hours');
                const mEl = document.getElementById('cd-mins');
                const sEl = document.getElementById('cd-secs');

                if (dEl) dEl.textContent = String(days).padStart(2, '0');
                if (hEl) hEl.textContent = String(hours).padStart(2, '0');
                if (mEl) mEl.textContent = String(mins).padStart(2, '0');
                if (sEl) sEl.textContent = String(secs).padStart(2, '0');
            }

            updateCountdown();
            setInterval(updateCountdown, 1000);
        });
    </script>
</body>
</html>
